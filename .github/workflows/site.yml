# Rebuilds the site with fresh market data and publishes it on GitHub Pages (free).
# Times are UTC: every 15 minutes from 08:30 to 16:15 IST on weekdays, plus once each evening.
name: Update data and publish site

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "*/15 3-10 * * 1-5"
    - cron: "30 12 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Keep the fundamentals cache between runs
        uses: actions/cache@v4
        with:
          path: .cache
          key: fundamentals-${{ github.run_id }}
          restore-keys: fundamentals-
      - name: Build site with fresh data
        run: python build_site.py site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
