# Render Blueprint: one free web service at https://nse-screener.onrender.com
services:
  - type: web
    name: nse-screener
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # one worker: scan progress lives in memory; threads serve visitors in parallel
    startCommand: gunicorn app:app --workers 1 --threads 12 --timeout 120 --bind 0.0.0.0:$PORT
    healthCheckPath: /api/timeframes
